<title>Chiffres à l'abordage !</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,600..900,100&family=Lexend:wght@400;500;600;700;800&display=swap">
<style>
/* Appli plein écran (max 560 px) : chaque écran est une couche absolue. Monde peint (images générées) + deux matières d'interface : verre sombre pour naviguer, parchemin pour lire et jouer. Laiton = action principale, cire = feu et erreurs. Un seul thème, nuit marine. */
:root{
  --abyss:#0b2230; --deep:#0f3446; --lagoon:#1d6b74; --foam:#e9f3ee; --mist:#9dbcbe;
  --parch:#f4e8cc; --parch-2:#e9d6ad; --ink:#2a1c12; --ink-2:#6b5440;
  --brass:#c9973f; --brass-hi:#f3d58c; --brass-lo:#6e4c18; --wax:#b8382a; --wax-hi:#e0644f; --kelp:#5cbf86;
  --glass:rgba(8,26,36,.62); --glass-line:rgba(243,213,140,.26);
  --f-d:'Fraunces',Georgia,'Times New Roman',serif; --f-u:'Lexend',system-ui,-apple-system,sans-serif;
  --st:env(safe-area-inset-top,0px); --sbm:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:#06141c;color:var(--foam);font-family:var(--f-u);font-size:15px;line-height:1.4;overflow:hidden;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;touch-action:manipulation;-webkit-user-select:none;user-select:none}
img{max-width:100%;-webkit-user-drag:none;user-select:none;pointer-events:none}
:focus-visible{outline:3px solid var(--brass-hi);outline-offset:2px;border-radius:8px}
#app{position:fixed;inset:0;max-width:560px;margin:0 auto;overflow:hidden;background:var(--abyss)}
.screen{position:absolute;inset:0;overflow:hidden}
.disp{font-family:var(--f-d);font-variation-settings:'SOFT' 100;font-weight:800;letter-spacing:-.01em}
.smallcaps{font:600 11.5px var(--f-u);letter-spacing:.22em;text-transform:uppercase}
.num{font-variant-numeric:tabular-nums lining-nums}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(14px) saturate(140%);backdrop-filter:blur(14px) saturate(140%);border:1px solid var(--glass-line);box-shadow:0 10px 30px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.08)}
.paper{color:var(--ink);background:#f4e8cc url(assets/tex-parchment.webp) center/300px;box-shadow:0 18px 40px rgba(4,16,22,.45),inset 0 0 0 1px rgba(138,98,36,.35),inset 0 0 30px rgba(138,98,36,.18)}
.brass-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:58px;border-radius:18px;font:700 18px var(--f-u);color:#2a1a07;background:linear-gradient(180deg,#f7dc93 0%,#d9a74a 48%,#b07f2c 52%,#c9973f 100%);box-shadow:0 6px 0 var(--brass-lo),0 12px 24px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.7);text-shadow:0 1px 0 rgba(255,240,200,.6);transition:transform .08s}
.brass-btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--brass-lo),inset 0 1px 0 rgba(255,255,255,.7)}
.brass-btn small{font-weight:500;font-size:13px;opacity:.75}
.brass-btn[disabled]{filter:grayscale(.8) brightness(.8);pointer-events:none}
.ghost-btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:46px;border-radius:14px;font:600 15px var(--f-u);color:var(--foam);background:rgba(255,255,255,.06);box-shadow:inset 0 0 0 1px var(--glass-line)}
.ghost-btn.dark{color:var(--ink);background:rgba(42,28,18,.06);box-shadow:inset 0 0 0 1px rgba(42,28,18,.25)}
.round{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#fff;flex:none}
.round svg{width:22px;height:22px}
.chip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:15px;font:600 13px var(--f-u);white-space:nowrap}
.toast{position:fixed;left:50%;bottom:calc(var(--sbm) + 110px);transform:translateX(-50%);z-index:200;max-width:min(90vw,420px);padding:12px 16px;border-radius:16px;font-weight:600;text-align:center;animation:rise .25s ease-out}
@keyframes rise{from{opacity:0;transform:translate(-50%,10px)}}

/* ---------- Carte ---------- */
.map-scroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.map-scroll::-webkit-scrollbar{display:none}
.map{position:relative;width:100%;height:2000px}
.ocean{position:absolute;inset:0;background:#0f3d52 url(assets/tex-ocean.webp) 0 0/360px;animation:drift 120s linear infinite;filter:brightness(.92)}
@keyframes drift{to{background-position:360px 720px}}
.glints{position:absolute;inset:0;background:radial-gradient(60px 18px at 20% 30%,rgba(255,240,200,.18),transparent),radial-gradient(80px 20px at 70% 55%,rgba(255,240,200,.14),transparent),radial-gradient(70px 16px at 35% 80%,rgba(255,240,200,.14),transparent);background-size:390px 600px;animation:glint 9s ease-in-out infinite alternate;mix-blend-mode:screen}
@keyframes glint{to{background-position:60px 40px;opacity:.5}}
.route{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.isle{position:absolute;width:210px;height:230px;transform:translate(-50%,-50%);display:block}
.isle .lag{position:absolute;left:50%;top:52%;width:250px;transform:translate(-50%,-50%);opacity:.92;filter:saturate(.9);-webkit-mask:radial-gradient(closest-side,#000 72%,transparent);mask:radial-gradient(closest-side,#000 72%,transparent);animation:lagpulse 6s ease-in-out infinite}
@keyframes lagpulse{50%{opacity:.75;transform:translate(-50%,-50%) scale(1.03)}}
.isle .land{position:absolute;left:50%;top:44%;width:190px;transform:translate(-50%,-50%);filter:drop-shadow(0 10px 8px rgba(4,18,26,.45))}
.isle .lbl{position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);text-align:center;white-space:nowrap}
.isle .lbl b{display:block;font-family:var(--f-d);font-variation-settings:'SOFT' 100;font-weight:800;font-size:16px;color:#fffaf0;text-shadow:0 1px 2px rgba(0,0,0,.8),0 0 14px rgba(0,0,0,.55)}
.lvl-pill{display:inline-flex;align-items:center;gap:6px;margin-top:4px;font:700 11px var(--f-u);letter-spacing:.06em;color:#2a1a07;background:linear-gradient(#f7dc93,#c9973f);padding:3px 9px;border-radius:10px;box-shadow:0 2px 0 var(--brass-lo)}
.lvl-pill.lock{background:rgba(8,26,36,.75);color:#cfe0df;box-shadow:inset 0 0 0 1px var(--glass-line)}
.isle.locked .land,.isle.locked .lag{filter:brightness(.55) saturate(.2) blur(1px)}
.isle.cur .land{animation:bob 3.2s ease-in-out infinite}
@keyframes bob{50%{transform:translate(-50%,calc(-50% - 5px))}}
.fogpatch{position:absolute;width:360px;transform:translate(-50%,-50%);pointer-events:none;opacity:.95;animation:fogdrift 14s ease-in-out infinite alternate}
@keyframes fogdrift{to{transform:translate(calc(-50% + 24px),-50%)}}
.ship-token{position:absolute;width:86px;transform:translate(-50%,-50%) rotate(-30deg);pointer-events:none;filter:drop-shadow(0 8px 6px rgba(0,0,0,.4));animation:shipbob 3s ease-in-out infinite;transition:left 1.2s ease-in-out,top 1.2s ease-in-out}
@keyframes shipbob{50%{transform:translate(-50%,calc(-50% - 4px)) rotate(-26deg)}}
.seas{position:absolute;left:50%;top:calc(var(--st) + 82px);transform:translateX(-50%);z-index:19;display:flex;gap:4px;padding:4px;border-radius:22px;white-space:nowrap}
.seas button{height:38px;padding:0 13px 0 6px;border-radius:18px;display:flex;align-items:center;gap:7px;font:600 14px var(--f-u);color:#cfe0df}
.seas button b{display:grid;place-items:center;min-width:30px;height:26px;padding:0 5px;border-radius:13px;font:800 12px var(--f-u);letter-spacing:.02em;background:rgba(255,255,255,.1);color:#cfe0df}
.seas button[aria-pressed="true"]{background:linear-gradient(180deg,#f7dc93,#c9973f);color:#2a1a07;box-shadow:0 3px 0 var(--brass-lo)}
.seas button[aria-pressed="true"] b{background:rgba(42,26,7,.14);color:#2a1a07}
@media (max-width:360px){.seas button{font-size:12.5px;padding:0 9px 0 5px}}
.map.sea-f .ocean{filter:brightness(.92) hue-rotate(-28deg) saturate(1.15)}
.kraken-tease{position:absolute;left:50%;top:150px;width:240px;transform:translateX(-50%);filter:brightness(.15) saturate(0) blur(1.5px);opacity:.55;pointer-events:none}
.mers{position:absolute;left:0;right:0;top:270px;text-align:center;font:700 13px var(--f-d);letter-spacing:.3em;color:#3c5960;text-transform:uppercase;pointer-events:none}
.hud{position:absolute;left:12px;right:12px;top:calc(var(--st) + 10px);height:64px;border-radius:22px;display:flex;align-items:center;gap:10px;padding:0 9px;z-index:20}
.medal{width:48px;height:48px;border-radius:50%;flex:none;overflow:hidden;background:#173f52;box-shadow:0 0 0 2px #0a2230,0 0 0 3.5px var(--brass)}
.medal img{width:100%;height:100%;object-fit:cover;object-position:50% 20%;transform:scale(1.15)}
.hud .nm{font-family:var(--f-d);font-weight:800;font-size:17px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
.hud .rk{font-size:12px;color:var(--mist);display:flex;align-items:center;gap:6px}
.xp{width:58px;height:5px;border-radius:3px;background:rgba(255,255,255,.14);overflow:hidden}.xp i{display:block;height:100%;background:linear-gradient(90deg,var(--brass),var(--brass-hi))}
.purse{margin-left:auto;display:flex;align-items:center;gap:6px;height:38px;padding:0 12px 0 6px;border-radius:19px;background:rgba(0,0,0,.28);box-shadow:inset 0 0 0 1px rgba(243,213,140,.22)}
.purse img{width:26px;height:26px}
.purse b{font:700 16px var(--f-u);color:var(--brass-hi)}
.cog{width:38px;height:38px;border-radius:13px;display:grid;place-items:center;color:#cfe0df;background:rgba(0,0,0,.28);box-shadow:inset 0 0 0 1px rgba(243,213,140,.18);position:relative;overflow:hidden}
.cog svg{width:20px;height:20px}
.cog i{position:absolute;left:0;bottom:0;height:3px;width:0;background:var(--brass-hi)}
.cog.hold i{width:100%;transition:width 2s linear}
.tide{position:absolute;left:12px;right:12px;bottom:calc(var(--sbm) + 92px);border-radius:24px;padding:14px 14px 14px;z-index:20}
.tide h2{margin:4px 0 10px;font-family:var(--f-d);font-variation-settings:'SOFT' 100;font-weight:800;font-size:22px;line-height:1.05}
.stops{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:12px}
.stop{border-radius:14px;padding:6px 6px 7px;text-align:center;background:rgba(255,255,255,.4);box-shadow:inset 0 0 0 1px rgba(138,98,36,.28);position:relative}
.stop img{width:54px;height:46px;object-fit:contain;display:block;margin:0 auto 2px}
.stop b{display:block;font:600 11.5px var(--f-u);line-height:1.15}
.stop span{font-size:10.5px;color:var(--ink-2)}
.stop.cur{background:rgba(255,255,255,.78);box-shadow:inset 0 0 0 1.5px var(--brass),0 4px 12px rgba(138,98,36,.25)}
.stop.done{opacity:.65}
.stop.done::after{content:"✓";position:absolute;top:4px;right:6px;width:20px;height:20px;border-radius:50%;background:var(--kelp);color:#fff;font:800 12px/20px var(--f-u)}
.seal{position:absolute;right:-6px;top:-16px;width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,var(--wax-hi),var(--wax) 55%,#6e1a12);box-shadow:0 4px 8px rgba(0,0,0,.3),inset 0 0 0 4px rgba(0,0,0,.12);transform:rotate(12deg);color:#f7d9c4;font:800 9.5px/1.05 var(--f-u);letter-spacing:.06em;text-align:center}
.dock{position:absolute;left:12px;right:12px;bottom:calc(var(--sbm) + 12px);height:68px;border-radius:24px;display:grid;grid-template-columns:repeat(3,1fr);align-items:center;z-index:30}
.dock button{display:flex;flex-direction:column;align-items:center;gap:3px;font:600 11.5px var(--f-u);color:#8fb0b3;height:100%}
.dock button svg{width:26px;height:26px;margin-top:9px}
.dock button[aria-current="page"]{color:var(--brass-hi)}

/* ---------- Île ---------- */
.hero{position:absolute;left:0;right:0;top:0;height:340px;overflow:hidden}
.hero img.bg{width:100%;height:100%;object-fit:cover}
.hero .isl-on{position:absolute;right:-10px;bottom:30px;width:62%;filter:drop-shadow(0 12px 10px rgba(0,0,0,.4))}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,26,36,.35),transparent 30%,transparent 55%,rgba(8,26,36,.85))}
.hero .tt{position:absolute;left:20px;right:20px;bottom:44px;z-index:2}
.hero .tt .disp{font-size:36px;line-height:1.02;color:#fffaf0;text-shadow:0 2px 14px rgba(0,0,0,.5)}
.topbar{position:absolute;left:16px;right:16px;top:calc(var(--st) + 12px);display:flex;justify-content:space-between;align-items:center;z-index:10}
.sheet{position:absolute;left:0;right:0;top:310px;bottom:0;border-radius:30px 30px 0 0;display:flex;flex-direction:column;z-index:5}
.stats{display:grid;grid-template-columns:1.1fr 1fr 1fr;align-items:center;padding:16px 16px 12px;border-bottom:1px solid rgba(138,98,36,.25)}
.stat{display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
.stat+.stat::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:1px;background:rgba(138,98,36,.25)}
.stat b{font-family:var(--f-d);font-weight:800;font-size:24px;line-height:1}
.stat span{font-size:11.5px;color:var(--ink-2);font-weight:500}
.route-list{flex:1;overflow-y:auto;position:relative;padding:6px 0 10px}
.rnode{position:absolute;transform:translate(-50%,-50%);display:grid;place-items:center;border-radius:50%;font-family:var(--f-d);font-weight:800}
.rnode.done{width:54px;height:54px;background:radial-gradient(circle at 40% 30%,#2d7a8a,#0f3446);box-shadow:0 0 0 3px var(--parch),0 0 0 5px var(--brass),0 6px 12px rgba(42,28,18,.3);color:var(--foam);font-size:21px}
.rnode.cur{width:76px;height:76px;background:radial-gradient(circle at 40% 30%,#ffe9a8,#d9a74a 60%,#9a6b20);box-shadow:0 0 0 4px var(--parch),0 0 0 7px var(--wax),0 10px 20px rgba(42,28,18,.35);font-size:30px;color:#3a2408;animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 4px var(--parch),0 0 0 7px var(--wax),0 0 0 18px rgba(184,56,42,.12),0 10px 20px rgba(42,28,18,.35)}}
.rnode.lock{width:48px;height:48px;background:#e2d2ad;box-shadow:inset 0 0 0 2px rgba(138,98,36,.35);color:#9a8460;font-size:16px}
.rnode img{width:120%;max-width:none}
.rnode svg{width:20px;height:20px}
.rnode.chest{width:60px;height:60px;background:radial-gradient(circle,#fff3c9,#e9cf8f);box-shadow:0 0 0 3px var(--parch),0 0 0 5px var(--brass)}
.rnode.boss{width:74px;height:74px;overflow:hidden;background:#1a1222;box-shadow:0 0 0 3px var(--parch),0 0 0 5.5px var(--wax)}
.rnode.boss img{width:100%;height:100%;object-fit:cover;transform:scale(1.3) translateY(6%)}
.rnode.lockimg img{filter:grayscale(1) brightness(.6)}
.rstars{position:absolute;transform:translateX(-50%);display:flex;gap:1px;font-size:12px;color:var(--brass);letter-spacing:-1px}
.rlab{position:absolute;font-size:12px;line-height:1.25;color:var(--ink-2);max-width:150px}
.rlab b{display:block;font-family:var(--f-d);font-weight:700;font-size:15px;color:var(--ink)}
.sheet .cta{padding:10px 16px calc(var(--sbm) + 16px);border-top:1px solid rgba(138,98,36,.2);display:flex;flex-direction:column;gap:8px}

/* ---------- Jeu ---------- */
.game{display:flex;flex-direction:column}
.g-scene{position:relative;flex:1;min-height:200px;overflow:hidden}
.g-scene img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.g-scene .waves{position:absolute;left:-6%;right:-6%;bottom:-2px;height:34%;background:url(assets/fg-waves.webp) 50% 100%/100% auto no-repeat;animation:wavex 7s ease-in-out infinite alternate;z-index:4;pointer-events:none}
@keyframes wavex{to{transform:translateX(-3%)}}
.ship{position:absolute;bottom:20%;z-index:3;transition:transform 1.2s ease-in,opacity 1.2s}
.ship.me{left:-3%;width:54%;animation:shipr 3.4s ease-in-out infinite}
.ship.foe{right:-3%;width:52%;animation:shipr 3.8s ease-in-out infinite reverse}
@keyframes shipr{50%{transform:translateY(-4px) rotate(-1.2deg)}}
.ship.foe.hit{animation:hit .5s}
@keyframes hit{30%{transform:translateX(6px) rotate(3deg)}}
.ship.foe.sunk{animation:none;transform:translateY(60%) rotate(14deg);opacity:0}
.ship.foe.boss{width:56%;bottom:8%}
.bossfig{position:absolute;left:50%;bottom:10%;width:min(66%,320px);transform:translateX(-50%);z-index:3;filter:drop-shadow(0 14px 14px rgba(0,0,0,.45));animation:bossb 3.2s ease-in-out infinite;transition:transform 1.1s ease-in,opacity 1.1s}
@keyframes bossb{50%{transform:translateX(-50%) translateY(-6px) rotate(-1.5deg)}}
.bossfig.hit{animation:bosshit .5s}
@keyframes bosshit{30%{transform:translateX(-46%) rotate(4deg);filter:drop-shadow(0 14px 14px rgba(0,0,0,.45)) brightness(1.6)}}
.bossfig.sunk{animation:none;transform:translateX(-50%) translateY(50%) scale(.6) rotate(-12deg);opacity:0}
.ball{position:absolute;width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#666,#111);z-index:5;opacity:0;pointer-events:none}
.fx{position:absolute;pointer-events:none;z-index:6}
.fx.boom{animation:boom .7s ease-out forwards}
@keyframes boom{0%{transform:translate(-50%,-50%) scale(.2);opacity:1}60%{opacity:1}100%{transform:translate(-50%,-50%) scale(1.2);opacity:0}}
.fx.smoke{animation:smoke 1.6s ease-out forwards}
@keyframes smoke{0%{transform:translate(-50%,-50%) scale(.4);opacity:.9}100%{transform:translate(-50%,-90%) scale(1.3);opacity:0}}
.fx.splash{animation:splash .9s ease-out forwards}
@keyframes splash{0%{transform:translate(-50%,-30%) scale(.3);opacity:1}100%{transform:translate(-50%,-60%) scale(1);opacity:0}}
.ghud{position:absolute;top:calc(var(--st) + 10px);left:12px;right:12px;display:flex;align-items:center;gap:8px;z-index:10}
.segs{flex:1;height:42px;border-radius:21px;display:flex;align-items:center;gap:5px;padding:0 14px}
.segs i{flex:1;height:7px;border-radius:4px;background:rgba(255,255,255,.18)}
.segs i.ok{background:linear-gradient(90deg,var(--brass),var(--brass-hi))}
.segs i.ko{background:var(--wax-hi)}
.segs i.cur{background:rgba(255,255,255,.7)}
.combo{height:42px;border-radius:21px;display:flex;align-items:center;gap:4px;padding:0 12px 0 10px;color:#ffcf7a;font:800 16px var(--f-u)}
.combo svg{width:18px;height:18px;color:#ff9d3c}
.hpbox{position:absolute;right:12px;top:calc(var(--st) + 60px);width:190px;border-radius:16px;padding:8px 12px 10px;z-index:10}
.hpbox>div:first-child{gap:8px;align-items:baseline}.hpbox #hpt{white-space:nowrap}
.hpbox .bar{height:10px;border-radius:5px;background:rgba(0,0,0,.45);box-shadow:inset 0 0 0 1px rgba(243,213,140,.35);overflow:hidden;margin-top:6px}
.hpbox .bar i{display:block;height:100%;background:linear-gradient(90deg,#b8382a,#ef7a4a);border-radius:5px;transition:width .5s}
.powers{position:absolute;left:12px;top:calc(var(--st) + 62px);display:flex;flex-direction:column;align-items:flex-start;gap:6px;z-index:8}
.pw{height:42px;border-radius:21px;display:flex;align-items:center;gap:7px;padding:0 12px 0 3px;font:600 13px var(--f-u);white-space:nowrap}
.pw img{width:36px;height:36px;border-radius:50%;background:#0f3446;box-shadow:0 0 0 1.5px var(--brass);object-fit:cover}
.pw small{display:none}
.pw[disabled]{opacity:.4;pointer-events:none}
.g-bottom{position:relative;flex:none;padding:0 12px calc(var(--sbm) + 12px);background:linear-gradient(180deg,rgba(11,34,48,0),var(--abyss) 26px);margin-top:-26px;z-index:9}
.qcard{border-radius:22px;padding:12px 14px 14px;margin-bottom:10px;position:relative}
.qcard .ask{font-size:14.5px;font-weight:600;color:var(--ink-2);text-align:center;line-height:1.3;text-wrap:balance}
.qcard .prompt{font-family:var(--f-d);font-weight:800;font-size:clamp(34px,10.5vw,52px);line-height:1.08;text-align:center;font-variant-numeric:tabular-nums;color:var(--ink);text-wrap:balance}
.qcard .prompt.mid{font-size:clamp(22px,6.4vw,30px)}
.words{font-family:var(--f-u);font-weight:700;font-size:clamp(17px,5vw,21px);color:#7a3f20;display:inline-block;line-height:1.25}
.slot{display:inline-grid;place-items:center;min-width:1.7em;padding:0 .15em;border-radius:14px;background:rgba(255,255,255,.55);box-shadow:inset 0 2px 4px rgba(42,28,18,.18),inset 0 0 0 1.5px rgba(138,98,36,.45);color:var(--wax);font-style:italic}
.slot:empty::before{content:"?";opacity:.3;font-style:normal}
.timer{position:absolute;right:12px;top:10px;width:26px;height:26px}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.key{height:54px;border-radius:16px;display:grid;place-items:center;font-family:var(--f-d);font-weight:700;font-size:28px;color:var(--ink);background:linear-gradient(#fbf3df,#ecdcb6);box-shadow:0 4px 0 #a98a52,0 8px 14px rgba(0,0,0,.25),inset 0 1px 0 #fff;transition:transform .06s}
.key:active{transform:translateY(3px);box-shadow:0 1px 0 #a98a52,inset 0 1px 0 #fff}
.key.dk{background:rgba(8,26,36,.75);color:#cfe0df;box-shadow:0 4px 0 #041016,inset 0 0 0 1px rgba(243,213,140,.2)}
.key.dk svg{width:26px;height:26px}
.key.fire{background:linear-gradient(#e0644f,#b8382a 60%,#962a1e);color:#fff3e6;font:700 17px var(--f-u);display:flex;gap:6px;box-shadow:0 4px 0 #5e170f,0 8px 14px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.35)}
.key.fire svg{width:22px;height:22px}
.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.choice{min-height:72px;border-radius:18px;font-family:var(--f-d);font-weight:800;font-size:clamp(24px,7.5vw,32px);color:var(--ink);background:linear-gradient(#fbf3df,#ecdcb6);box-shadow:0 5px 0 #a98a52,0 10px 16px rgba(0,0,0,.25),inset 0 1px 0 #fff;padding:4px 2px;font-variant-numeric:tabular-nums}
.choice:active{transform:translateY(3px);box-shadow:0 2px 0 #a98a52}
.choice.right{background:linear-gradient(#a6e3bf,#5cbf86);box-shadow:0 5px 0 #2b7a4d,0 0 22px rgba(92,191,134,.6)}
.choice.wrong{background:linear-gradient(#f2b0a3,#e0644f);box-shadow:0 5px 0 #8e2a20;animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.qcard .prompt.sent{font:600 clamp(18px,5.2vw,22px)/1.35 var(--f-u);margin-top:4px}
.qcard .prompt.sent .slot{min-width:2.6em;height:1.35em;vertical-align:-.2em;border-radius:9px}
.qcard mark{background:linear-gradient(transparent 12%,#f7dc93 12%,#f3c86a 90%,transparent 90%);color:var(--ink);padding:0 .12em;border-radius:3px}
.choices.txt{grid-template-columns:1fr;gap:8px}
.choices.txt .choice{min-height:50px;font:700 clamp(16px,4.6vw,19px)/1.25 var(--f-u);padding:8px 12px;text-wrap:balance}
.choices.two{grid-template-columns:1fr 1fr}
.wchips{display:flex;flex-wrap:wrap;justify-content:center;gap:7px;margin-top:8px}
.wchips button{min-height:44px;padding:6px 12px;border-radius:12px;font:600 18px var(--f-u);background:rgba(255,255,255,.55);box-shadow:inset 0 0 0 1.5px rgba(138,98,36,.45),0 2px 0 rgba(138,98,36,.35);color:var(--ink)}
.wchips.grp button{font-size:16.5px}
.wchips button[aria-pressed="true"]{background:linear-gradient(180deg,#f7dc93,#c9973f);box-shadow:0 3px 0 var(--brass-lo)}
.rtext{max-height:min(34vh,260px);overflow-y:auto;-webkit-overflow-scrolling:touch;padding:2px 4px 6px;margin:-2px -4px 8px;border-bottom:1.5px dashed rgba(138,98,36,.45);font:400 16px/1.55 var(--f-u);color:var(--ink)}
.rtext b{display:block;font:800 18px var(--f-d);margin-bottom:4px}
.rtext p{margin:0 0 6px}
.qcard .ask.rq{font-size:16.5px;color:var(--ink)}
.game.tall .g-scene{flex:1 1 auto;min-height:calc(var(--st) + 112px)}
.game.tall .g-bottom{flex:0 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
.game.tall>.burst{top:40%}.game.tall>.ifx.let{top:45%;z-index:21}
.game.tall .powers{flex-direction:row;top:calc(var(--st) + 58px)}
.game.tall .pw span{display:none}.game.tall .pw{padding:0 3px}
.game.tall .hpbox{top:calc(var(--st) + 58px);width:min(220px,58%);padding:5px 10px 7px}
.hpbox .smallcaps{font-size:11.5px;letter-spacing:.06em!important;line-height:1.2}
.ifx.let{top:62%;font:900 46px var(--f-d);color:#fff3d0;text-shadow:0 3px 0 #8a6224,0 6px 14px rgba(0,0,0,.45);animation:letfly 1.1s ease-out forwards}
@keyframes letfly{0%{transform:translateY(0) scale(.4) rotate(-10deg);opacity:0}25%{opacity:1}100%{transform:translateY(-120px) scale(1.15) rotate(12deg);opacity:0}}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1;margin:0 .08em}
.frac b{font-weight:inherit;padding:0 .12em}
.frac b:first-child{border-bottom:.08em solid currentColor;padding-bottom:.04em}
.valid{margin-top:10px}

/* blocs de la mine */
.mine-cols{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:8px}
.mcol{display:flex;flex-direction:column;align-items:center;gap:4px;border-radius:14px;padding:6px 3px;background:rgba(244,232,204,.92);color:var(--ink);box-shadow:inset 0 0 0 1px rgba(138,98,36,.35)}
.mcol-h{font:700 10px var(--f-u);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.pile{height:64px;width:100%;display:flex;flex-wrap:wrap-reverse;align-content:flex-start;justify-content:center;gap:2px;overflow:hidden}
.cnt{font-family:var(--f-d);font-weight:800;font-size:22px;line-height:1}
.pm{display:flex;gap:4px;width:100%}
.pm button{flex:1;height:38px;border-radius:10px;font:800 22px var(--f-d);background:linear-gradient(#fbf3df,#ecdcb6);box-shadow:0 3px 0 #a98a52;color:var(--ink)}
.pm button.plus{background:linear-gradient(#f7dc93,#c9973f);box-shadow:0 3px 0 var(--brass-lo)}
.blk{display:block;background:center/contain no-repeat}
.b-m{width:26px;height:26px;background-image:url(assets/block-1000.webp)}
.b-c{width:24px;height:24px;background-image:url(assets/block-100.webp)}
.b-d{width:22px;height:22px;background-image:url(assets/block-10.webp)}
.b-u{width:13px;height:13px;background-image:url(assets/block-1.webp)}
/* monnaie */
.tray{min-height:56px;display:flex;flex-wrap:wrap;gap:4px;justify-content:center;align-content:center;border:2px dashed rgba(138,98,36,.5);border-radius:14px;padding:6px;margin-top:8px}
.tray:empty::before{content:"Touche les pièces et les billets pour payer";color:var(--ink-2);font-size:13px;font-weight:600}
.purse-g{display:flex;flex-wrap:wrap;gap:7px;justify-content:center}
.coin,.bill{display:inline-grid;place-items:center;font-weight:800;line-height:1;color:#2a1a07;background:center/100% 100% no-repeat;filter:drop-shadow(0 3px 2px rgba(0,0,0,.4))}
.coin{width:50px;height:50px;border-radius:50%;font-size:14px;text-shadow:0 1px 0 rgba(255,240,200,.6)}
.coin.cu{background-image:url(assets/coin-copper.webp);color:#fff8ec;text-shadow:0 1px 2px rgba(60,20,0,.8)}
.coin.au{background-image:url(assets/coin-gold.webp)}
.coin.bi{background-image:url(assets/coin-bimetal.webp)}
.bill{width:62px;height:40px;border-radius:6px;font-size:15px}
.bill.b50{background-image:url(assets/bill-red.webp);filter:hue-rotate(32deg) saturate(1.3) drop-shadow(0 3px 2px rgba(0,0,0,.4))}.fbar .cells i.sep{border-right-width:6px}
.bill.b5{background-image:url(assets/bill-green.webp)}.bill.b10{background-image:url(assets/bill-red.webp)}.bill.b20{background-image:url(assets/bill-blue.webp)}
.tray .coin{width:36px;height:36px;font-size:11px}.tray .bill{width:46px;height:30px;font-size:12px}
.pricetag{display:inline-flex;align-items:center;gap:8px;font-family:var(--f-d);font-weight:800;font-size:34px;color:var(--ink)}
/* parts */
.pizza{width:min(170px,46vw);height:auto;touch-action:manipulation}
.slice{fill:rgba(255,255,255,0);stroke:#2a1c12;stroke-width:2.5;cursor:pointer}
.slice.on{fill:rgba(184,56,42,.6)}
.pizza.cake{width:min(130px,36vw)}.pizza.cake .slice{cursor:default;stroke:rgba(42,28,18,.8)}
.fbars{display:flex;flex-direction:column;gap:10px;margin:6px 0}
.fbar{display:flex;align-items:center;gap:10px}
.fbar .cells{flex:1;display:flex;height:28px;border-radius:8px;overflow:hidden;box-shadow:inset 0 0 0 2px var(--ink);background:#fff8e8}
.fbar .cells i{flex:1;border-right:2px solid var(--ink)}.fbar .cells i:last-child{border-right:0}
.fbar .cells i.on{background:linear-gradient(#f7dc93,#c9973f)}
.fbar .lab{font-family:var(--f-d);font-weight:800;font-size:22px;width:2.2em;text-align:center}
.line-svg{width:100%;height:auto;touch-action:manipulation;cursor:pointer}
.line-svg text{font-family:var(--f-u);font-weight:700;fill:var(--ink)}

.burst{position:absolute;left:50%;top:34%;transform:translate(-50%,-50%);z-index:20;text-align:center;pointer-events:none;animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
.burst .w{display:block;font-family:var(--f-d);font-weight:900;font-size:clamp(40px,12vw,58px);color:#fff3d0;text-shadow:0 3px 0 #9a4a1a,0 8px 24px rgba(0,0,0,.5);white-space:nowrap}
.burst .g{display:inline-flex;align-items:center;gap:6px;margin-top:4px;font:800 18px var(--f-u);color:var(--brass-hi);text-shadow:0 2px 6px rgba(0,0,0,.6)}
.burst .g img{width:26px}
@keyframes pop{0%{transform:translate(-50%,-50%) scale(.3);opacity:0}100%{transform:translate(-50%,-50%) scale(1);opacity:1}}
.sheet-err{position:absolute;left:0;right:0;bottom:0;z-index:40;border-radius:26px 26px 0 0;padding:18px 16px calc(var(--sbm) + 16px);animation:up .25s ease-out;display:flex;flex-direction:column;gap:10px}
@keyframes up{from{transform:translateY(100%)}}
.sheet-err .who{display:flex;gap:12px;align-items:flex-start}
.sheet-err .who img{width:74px;flex:none;margin-top:-34px;filter:drop-shadow(0 6px 6px rgba(0,0,0,.25))}
.sheet-err h3{margin:0;font-family:var(--f-d);font-weight:800;font-size:24px;color:var(--wax)}
.sheet-err .good{font-weight:700;font-size:16px;margin-top:2px}
.sheet-err .why{margin:0;font-size:15px;line-height:1.45;background:rgba(255,255,255,.45);border-radius:14px;padding:10px 12px;box-shadow:inset 0 0 0 1px rgba(138,98,36,.25)}

/* ---------- Résultat ---------- */
.result{background:radial-gradient(ellipse 70% 45% at 50% 34%,#3a5a64,#0f3446 55%,#081a24);display:flex;flex-direction:column;align-items:center;padding-bottom:calc(var(--sbm) + 16px)}
.rays{position:absolute;left:50%;top:330px;width:900px;height:900px;transform:translate(-50%,-50%);background:repeating-conic-gradient(from 0deg,rgba(255,214,140,.16) 0 7deg,transparent 7deg 18deg);-webkit-mask:radial-gradient(circle,#000 10%,transparent 55%);mask:radial-gradient(circle,#000 10%,transparent 55%);animation:spin 40s linear infinite}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
.result .head{position:relative;text-align:center;margin-top:calc(var(--st) + 36px);padding:0 20px;flex:none}
.result .head .disp{font-size:30px;line-height:1.05;color:#fffaf0;text-shadow:0 4px 18px rgba(0,0,0,.4)}
.stars{display:flex;justify-content:center;align-items:flex-end;gap:2px;margin-top:8px}
.stars svg{filter:drop-shadow(0 3px 4px rgba(0,0,0,.4))}
.stars .off{opacity:.25}
.chest{position:relative;width:200px;height:170px;margin-top:2px;display:grid;place-items:center;flex:none}
.chest img{position:absolute;width:190px;transition:opacity .3s}
.chest.shake img.closed{animation:shakec .5s ease-in-out infinite}
@keyframes shakec{25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}}
.chest .glow{position:absolute;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,rgba(255,231,168,.8),rgba(255,196,106,.3) 40%,transparent 70%);opacity:0;transition:opacity .5s}
.chest.open .glow{opacity:1}
.chest .tap{position:absolute;bottom:-6px;font:700 13px var(--f-u);color:var(--brass-hi);letter-spacing:.1em;text-transform:uppercase;animation:blink 1.4s ease-in-out infinite}
@keyframes blink{50%{opacity:.4}}
.chest img.bravo{width:96px;left:-62px;bottom:-4px;z-index:2;filter:drop-shadow(0 6px 6px rgba(0,0,0,.35));animation:shipr 2.6s ease-in-out infinite}
.coinfly{position:absolute;width:30px;z-index:50;pointer-events:none}
.rewards{position:relative;width:calc(100% - 32px);border-radius:22px;padding:4px 14px;flex:1 1 auto;min-height:0;overflow-y:auto;margin-bottom:12px}
.rw{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid rgba(138,98,36,.22);animation:rise2 .4s ease-out backwards}
.rw:first-child{border-top:0}
@keyframes rise2{from{opacity:0;transform:translateY(10px)}}
.rw .ic{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;overflow:hidden;background:#f7e6b8}
.rw .ic img{width:100%;height:100%;object-fit:cover}
.rw b{display:block;font-family:var(--f-d);font-weight:700;font-size:15.5px;line-height:1.15}
.rw span{font-size:12.5px;color:var(--ink-2)}
.tagr{font:700 10.5px var(--f-u);letter-spacing:.1em;text-transform:uppercase;padding:4px 7px;border-radius:8px;background:#f3d58c;color:#5a3a10}
.result .btns{position:relative;width:calc(100% - 32px);display:flex;flex-direction:column;gap:8px;flex:none;margin-top:auto}

/* ---------- Écrans onglets ---------- */
.tabpage{position:absolute;inset:0;overflow-y:auto;padding:calc(var(--st) + 86px) 16px calc(var(--sbm) + 100px)}
.tabpage h1{margin:0 0 4px;font-family:var(--f-d);font-weight:800;font-size:30px;color:#fffaf0}
.tabpage .sub{color:var(--mist);margin:0 0 16px;font-size:14px}
.crew-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.crew-card{border-radius:20px;padding:10px 10px 12px;text-align:center;position:relative}
.crew-card img{width:100%;aspect-ratio:1;object-fit:contain;filter:drop-shadow(0 8px 8px rgba(42,28,18,.25))}
.crew-card b{display:block;font-family:var(--f-d);font-weight:800;font-size:16px}
.crew-card span{display:block;font-size:12.5px;color:var(--ink-2);margin-top:2px}
.crew-card .rar{position:absolute;top:10px;left:10px;font:700 9.5px var(--f-u);letter-spacing:.12em;text-transform:uppercase;padding:3px 7px;border-radius:7px;background:#f3d58c;color:#5a3a10}
.crew-card.lock img{filter:brightness(0) opacity(.25)}
.crew-card.lock{background:rgba(255,255,255,.05);box-shadow:inset 0 0 0 1px var(--glass-line);color:var(--mist)}
.crew-card.lock span{color:var(--mist)}
.mystery{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.mystery div{aspect-ratio:1;border-radius:16px;display:grid;place-items:center;font:800 24px var(--f-d);color:#4d6a70;background:rgba(255,255,255,.04);box-shadow:inset 0 0 0 1px var(--glass-line)}
.showship{position:relative;border-radius:24px;overflow:hidden;height:200px;margin-bottom:16px}
.showship img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:brightness(.8)}
.showship img.sh{position:absolute;right:-2%;bottom:8px;width:64%;animation:shipr 3.4s ease-in-out infinite}
.showship::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(8,26,36,.55),transparent 55%);pointer-events:none}
.showship .cap{z-index:2;max-width:52%}
.showship .cap{position:absolute;left:14px;top:12px;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.5)}
.wood{background:#3b2617 url(assets/tex-wood.webp) center/320px}
.poster{position:relative;width:min(330px,88%);aspect-ratio:2/3;margin:0 auto;background:url(assets/poster-blank.webp) center/100% 100% no-repeat;filter:drop-shadow(0 20px 26px rgba(0,0,0,.55));transform:rotate(-1.2deg);color:var(--ink);text-align:center}
.poster .t1{position:absolute;left:0;right:0;top:10%;font-family:var(--f-d);font-weight:900;font-size:clamp(24px,7.6vw,32px);letter-spacing:.03em;line-height:1}
.poster .t2{position:absolute;left:14%;right:14%;top:18.5%;display:flex;align-items:center;gap:8px;color:var(--ink-2)}
.poster .t2 i{flex:1;height:1px;background:currentColor}
.poster .photo{position:absolute;left:17%;right:17%;top:23%;height:36%;overflow:hidden;border:2px solid #4b3422;background:linear-gradient(#e9b98a,#c97e52);box-shadow:inset 0 0 24px rgba(42,28,18,.4)}
.poster .photo img{width:100%;height:100%;object-fit:cover;object-position:50% 10%;filter:sepia(.25) saturate(1.05)}
.poster .nm{position:absolute;left:0;right:0;top:61%;font-family:var(--f-d);font-weight:900;font-size:clamp(26px,8vw,34px);line-height:1}
.poster .ep{position:absolute;left:0;right:0;top:68%;font-family:var(--f-d);font-style:italic;font-weight:600;font-size:15px;color:var(--ink-2)}
.poster .bounty{position:absolute;left:16%;right:16%;top:73.5%;display:flex;justify-content:center;align-items:center;gap:8px;padding:5px 0;border-top:1.5px solid rgba(75,52,34,.6);border-bottom:1.5px solid rgba(75,52,34,.6)}
.poster .bounty img{width:30px}
.poster .bounty b{font-family:var(--f-d);font-weight:900;font-size:clamp(28px,8.5vw,36px);line-height:1}
.poster .foot{position:absolute;left:18%;right:18%;top:81.5%;display:flex;justify-content:space-between;align-items:center;font-size:10px;color:var(--ink-2);text-align:left}
.waxs{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,var(--wax-hi),var(--wax) 55%,#6e1a12);color:#f7d9c4;font:800 10px/1.05 var(--f-u);text-align:center;transform:rotate(-10deg);box-shadow:0 3px 6px rgba(0,0,0,.35)}
.rank{border-radius:20px;padding:14px 16px;margin-top:22px}
.rank .bar{height:8px;border-radius:4px;background:rgba(255,255,255,.12);margin:9px 0 12px;overflow:hidden}
.rank .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--brass),var(--brass-hi))}
.eps{display:flex;gap:6px;flex-wrap:wrap}
.eps button{height:32px;padding:0 12px;border-radius:16px;font:600 13px var(--f-u);background:rgba(255,255,255,.06);color:#8fb0b3}
.eps button.have{color:var(--brass-hi);box-shadow:inset 0 0 0 1px rgba(243,213,140,.4)}
.eps button[aria-pressed="true"]{background:var(--brass-hi);color:#2a1a07}

/* ---------- Port, onboarding, parents ---------- */
.port img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 70%}
.port::before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,rgba(8,26,36,.55),transparent 32%,transparent 55%,rgba(8,26,36,.6))}
.port>div{z-index:2}
.port .shipw{position:absolute;left:50%;top:38%;width:78%;transform:translateX(-50%);animation:shipr 4s ease-in-out infinite}
.port .card{position:absolute;left:16px;right:16px;bottom:calc(var(--sbm) + 18px);border-radius:24px;padding:18px 16px 16px}
.modal{position:absolute;inset:0;z-index:100;display:grid;place-items:safe center;overflow-y:auto;padding:max(16px,calc(var(--st) + 60px)) 16px 16px;background:rgba(6,20,28,.6);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.modal .box{width:100%;max-width:400px;border-radius:26px;padding:20px 18px 18px;text-align:center;display:flex;flex-direction:column;gap:12px}
.grades{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grades button{min-height:64px;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:rgba(255,255,255,.6);box-shadow:inset 0 0 0 1.5px rgba(138,98,36,.45);color:var(--ink)}
.grades b{font:800 24px/1 var(--f-d)}.grades span{font-size:14px;color:var(--ink-2)}
.grades button[aria-pressed="true"]{background:linear-gradient(180deg,#f7dc93,#c9973f);box-shadow:0 4px 0 var(--brass-lo)}
.grades.nudge{animation:shake .4s}
.modal input{font:700 20px var(--f-u);text-align:center;border:0;border-radius:14px;padding:12px;width:100%;color:var(--ink);background:rgba(255,255,255,.75);box-shadow:inset 0 0 0 1.5px rgba(138,98,36,.5)}
.parents{position:absolute;inset:0;z-index:90;background:#0b2230;overflow-y:auto;padding:calc(var(--st) + 16px) 16px calc(var(--sbm) + 30px)}
.pcard{border-radius:20px;padding:14px 16px;margin-top:14px;background:rgba(255,255,255,.04);box-shadow:inset 0 0 0 1px var(--glass-line)}

.pill{display:inline-block;font:700 10.5px var(--f-u);letter-spacing:.06em;text-transform:uppercase;border-radius:6px;padding:1px 6px;margin-left:6px}
.pill.warn{background:#5a2420;color:#ffb9ad}.pill.good{background:#1f4a35;color:#a6e3bf}
.errs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.errs li{font-size:13.5px;background:rgba(255,255,255,.04);border-radius:10px;padding:7px 10px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{height:36px;padding:0 13px;border-radius:12px;font:600 13.5px var(--f-u);background:rgba(255,255,255,.06);color:#cfe0df}
.seg button[aria-pressed="true"]{background:var(--brass-hi);color:#2a1a07}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:100px}
.day{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px;height:100%;font-size:11.5px;color:var(--mist)}
.day i{display:block;width:70%;border-radius:5px 5px 0 0;background:linear-gradient(var(--brass-hi),var(--brass));min-height:2px}

/* ---------- Lot A : lisibilité enfant, carte, Mine, indice, sortie ---------- */
.smallcaps{font-size:13px;letter-spacing:.14em}
.lvl-pill{font-size:14px;letter-spacing:0;text-transform:none;padding:3px 10px}
.hud .rk{font-size:14px}

.stat span{font-size:13px}
.rstars{font-size:15px}
.rlab{font-size:14px;max-width:170px}.rlab b{font-size:16px}
.rw span{font-size:14px}.tagr{font-size:12px}
.crew-card span{font-size:14px;line-height:1.35}.crew-card .rar{font-size:11px}
.chest .tap{font-size:15px}
.burst .g{font-size:20px}
.tide{padding:12px 12px 12px;border-radius:22px}

.tide .mini .done::after{content:"✓";position:absolute;right:-4px;top:-4px;width:18px;height:18px;border-radius:50%;background:var(--kelp);color:#fff;font:800 11px/18px var(--f-u);text-align:center}
.tide .tt2{min-width:0;flex:1}
.tide .sub2{font:600 14px var(--f-u);color:var(--ink-2)}
.tide h2{margin:1px 0 0;font-size:20px;line-height:1.12}
@media (max-width:400px){.tide .mini{display:none}}
.brass-btn .play{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:rgba(42,26,7,.14)}
.brass-btn .play svg{width:16px;height:16px;margin-left:2px}
.brass-btn .lbl{display:flex;flex-direction:column;align-items:flex-start;line-height:1.05;text-align:left}
.brass-btn .lbl small{font-size:13px;margin-top:2px}
.mine-wrap{position:relative}
.mcol-h{font-size:13px;letter-spacing:0;text-transform:none}
.cnt{display:grid;place-items:center;width:100%;min-height:44px;border-radius:12px;background:rgba(255,255,255,.75);box-shadow:inset 0 0 0 2px var(--brass),0 2px 0 rgba(138,98,36,.35);font-size:26px;color:var(--ink)}
.pm button{height:48px;font-size:26px}
.digpick{position:absolute;inset:0;z-index:5;border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:8px;background:rgba(244,232,204,.98);box-shadow:0 10px 24px rgba(0,0,0,.3),inset 0 0 0 2px var(--brass)}

.digs{flex:1;display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.digs button{min-height:44px;border-radius:12px;font:800 24px var(--f-d);color:var(--ink);background:linear-gradient(#fbf3df,#ecdcb6);box-shadow:0 3px 0 #a98a52}

.pi-tip{position:absolute;left:12px;right:12px;bottom:38px;z-index:12;border-radius:18px;padding:10px 52px 10px 10px;display:flex;gap:10px;align-items:center;font-size:16px;line-height:1.35;color:var(--ink);animation:rise2 .3s ease-out}
.pi-tip img{width:58px;flex:none;filter:drop-shadow(0 4px 4px rgba(0,0,0,.2))}

.pi-tip .x svg{width:20px;height:20px}
.modal .box .disp{color:var(--ink)}
.shipcap{display:flex;flex-direction:column;gap:4px;margin:-6px 2px 18px}

.showship::after{display:none}
.poster .foot{font-size:13px;left:17%;right:17%}

.round{min-width:44px;min-height:44px}
.cog{width:44px;height:44px;flex:none}
.pw{height:44px}.pw img{width:38px;height:38px}
.bill{height:44px}
.hpbox #hpt{font-size:13px}

/* ---------- Lot B : tutoriels, île simplifiée, pouvoirs visibles, revanche, onglets ---------- */
.coach{position:absolute;inset:0;z-index:70}
.coach .ring{position:absolute;border-radius:18px;box-shadow:0 0 0 9999px rgba(6,20,28,.66),0 0 0 3px var(--brass-hi),0 0 24px 6px rgba(243,213,140,.55);transition:all .35s ease;pointer-events:none}
.coach .hand{position:absolute;width:46px;height:46px;pointer-events:none;filter:drop-shadow(0 4px 6px rgba(0,0,0,.45));animation:tapme 1.1s ease-in-out infinite;transition:left .35s,top .35s}
@keyframes tapme{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-4px,-6px) scale(.9)}}

.coach .bub .dots{display:flex;gap:5px}.coach .bub .dots i{width:8px;height:8px;border-radius:50%;background:rgba(42,28,18,.2)}.coach .bub .dots i.on{background:var(--brass)}
.coach .bub button{min-height:46px;padding:0 18px;border-radius:14px;font:700 16px var(--f-u);color:#2a1a07;background:linear-gradient(180deg,#f7dc93,#c9973f);box-shadow:0 3px 0 var(--brass-lo)}
.ghud .help{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none;font:800 20px var(--f-d);color:#ffe2a6}
.trophy{display:flex;align-items:center;gap:12px;padding:14px 16px 12px;border-bottom:1px solid rgba(138,98,36,.25)}
.trophy .ti{position:relative;width:64px;height:64px;flex:none;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,#fff3c9,#e9cf8f);box-shadow:0 0 0 3px var(--parch),0 0 0 5px var(--brass)}
.trophy .ti img{width:54px;height:54px;object-fit:contain}
.trophy .ti.boss{background:#1a1222;box-shadow:0 0 0 3px var(--parch),0 0 0 5.5px var(--wax);overflow:hidden}.trophy .ti.boss img{width:100%;height:100%;object-fit:cover;transform:scale(1.3) translateY(6%)}
.trophy .tt{flex:1;min-width:0}
.trophy .tt span{display:block;font-size:14px;color:var(--ink-2)}

.trophy .st{flex:none;text-align:center;font-family:var(--f-d);font-weight:800;font-size:20px;color:var(--ink)}
.trophy .st small{display:block;font:500 12.5px var(--f-u);color:var(--ink-2)}
.trophy .st i{font-style:normal;color:var(--brass)}
.pop{position:absolute;left:50%;bottom:34px;transform:translateX(-50%);z-index:15;display:flex;align-items:center;gap:8px;padding:5px 14px 5px 5px;border-radius:24px;font:700 15px var(--f-u);white-space:nowrap;color:#fff3d0;animation:popin .35s cubic-bezier(.2,1.5,.4,1)}
.pop img{width:38px;height:38px;border-radius:50%;object-fit:cover;background:#0f3446;box-shadow:0 0 0 1.5px var(--brass)}
@keyframes popin{from{opacity:0;transform:translate(-50%,8px) scale(.8)}}
.revb{position:absolute;left:50%;top:-13px;transform:translateX(-50%) rotate(-2deg);padding:3px 12px;border-radius:10px;font:800 14px var(--f-u);letter-spacing:.04em;color:#fff3e6;background:linear-gradient(#e0644f,#b8382a);box-shadow:0 3px 0 #5e170f;white-space:nowrap}
.dock .di{width:30px;height:30px;margin-top:8px;border-radius:50%;object-fit:cover;background:#173f52;box-shadow:0 0 0 1.5px rgba(243,213,140,.35);opacity:.8}
.dock .di.ship{object-fit:contain;background:none;box-shadow:none;transform:rotate(-30deg)}

.nextisle{display:flex;align-items:center;gap:10px;margin:0 0 12px;padding:8px 10px;border-radius:14px;background:rgba(42,28,18,.06)}

.nextisle span{font-size:14.5px;color:var(--ink-2);line-height:1.3}
.nextisle b{color:var(--ink)}

/* ---------- Lot C : écran titre, chantier naval, animations d'îles, horloge ---------- */

.title>*{position:relative;z-index:1}
.tlogo{text-align:center;color:#fffaf0;text-shadow:0 4px 18px rgba(0,0,0,.55)}

.title .vers2{position:absolute;right:14px;bottom:calc(var(--sbm) + 12px);font-size:12px;color:rgba(255,255,255,.5);z-index:1}

.g-scene .jframe{position:absolute;left:-4%;top:-4%;width:108%;height:108%;object-fit:cover;object-position:50% 100%;z-index:5;pointer-events:none;transform-origin:50% 100%;animation:sway 6s ease-in-out infinite}
@keyframes sway{50%{transform:scale(1.015) rotate(.4deg)}}

.clock{width:min(170px,46vw);height:auto;display:block;margin:4px auto 0}
.isle.soon .land{display:none}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

      { t: 'La tempête', x: 'La tempête arrive. Le ciel devient noir et le vent souffle très fort. Le capitaine crie : « Baissez les voiles ! »', q: [

    p: [

      { t: 'La bouteille à la mer', x: 'Lila écrit un message sur un morceau de papier : « Je m’appelle Lila. Je navigue sur le Fier Calcul. Qui me répondra ? » Elle roule le papier, le glisse dans une bouteille et la lance dans les vagues. Trois mois plus tard, une lettre arrive au port. Elle vient d’un garçon qui habite de l’autre côté de l’océan.', q: [

        ['a', 'Dans « et la lance dans les vagues », que remplace « la » ?', 'la bouteille', ['la lettre', 'Lila'], 'Lila glisse le papier dans une bouteille, puis elle lance la bouteille.'],

      { t: 'Le singe voleur', x: 'Les pirates accostent sur une île pleine de palmiers. Pendant que le capitaine dort, un singe saute sur son chapeau et l’emporte en haut d’un arbre. Le capitaine se réveille en criant. Pi éclate de rire : il n’a jamais vu son capitaine aussi décoiffé !', q: [

        ['i', 'Pourquoi le capitaine crie-t-il ?', 'Il découvre que son chapeau a disparu.', ['Il a vu un requin.', 'Il a mal au pied.'], 'On le devine : il se réveille sans son chapeau, volé pendant qu’il dormait.'],

        ['v', 'Que veut dire « accoster » ?', 's’approcher du rivage et s’arrêter', ['partir loin de l’île', 'grimper à un arbre'], 'Le bateau accoste : il arrive au bord de l’île et s’arrête.']] },
      { t: 'Le jus du capitaine', x: 'Pour faire le jus du capitaine, il te faut deux mangues, une banane et un verre d’eau de coco. Épluche les fruits. Coupe-les en morceaux. Mets-les dans le mixeur avec l’eau de coco. Mixe pendant une minute. Sers bien frais !', q: [

        ['a', 'Dans « Coupe-les en morceaux », que remplace « les » ?', 'les fruits', ['les verres', 'les pirates'], 'On vient d’éplucher les fruits : ce sont eux qu’on coupe.']] },
      { t: 'Le phare', x: 'Un phare est une haute tour construite au bord de la mer. En haut, une grosse lampe tourne toute la nuit. Sa lumière prévient les bateaux qu’il y a des rochers dangereux. Grâce aux phares, les marins peuvent naviguer sans danger la nuit.', q: [

        ['e', 'Quand la lampe tourne-t-elle ?', 'toute la nuit', ['toute la journée', 'seulement l’hiver'], 'Le texte dit : « une grosse lampe tourne toute la nuit ».'],
        ['i', 'Que pourrait-il arriver à un bateau sans phare, la nuit ?', 'Il pourrait heurter des rochers.', ['Il irait plus vite.', 'Il perdrait sa voile.'], 'Le phare prévient des rochers dangereux : sans lui, le bateau risque de les heurter.'],

      { t: 'La grotte', x: 'Tom et Lila entrent dans la grotte avec une lanterne. L’eau goutte du plafond. Au fond, ils voient un coffre couvert de toiles d’araignée. Tom tremble un peu, mais Lila soulève le couvercle. Le coffre est rempli de vieux livres !', q: [

        ['v', 'Le « couvercle », c’est :', 'le dessus qui ferme le coffre', ['le fond du coffre', 'la clé du coffre'], 'Lila soulève le couvercle pour ouvrir le coffre.']] },
      { t: 'Pi apprend un mot', x: 'Le capitaine apprend un nouveau mot à Pi : « Abordage ! » Pi le répète toute la journée. Il le crie pendant le repas, pendant la sieste et même au milieu de la nuit. Le lendemain, tout l’équipage a les yeux cernés.', q: [

      { t: 'La baleine bleue', x: 'La baleine bleue est le plus grand animal du monde. Elle peut mesurer trente mètres de long, autant que trois bus. Pourtant, elle se nourrit de tout petits animaux appelés krill. Elle en avale des tonnes chaque jour.', q: [

    l: [
      { t: 'La mer qui brille', x: 'Ce soir-là, la mer est calme. Le capitaine a promis une surprise à l’équipage. Tout le monde attend sur le pont, en silence.\nSoudain, l’eau autour du bateau s’allume : des milliers de petites lumières bleues dansent dans les vagues. « Ce sont des planctons lumineux », explique le capitaine.\nLila plonge la main dans l’eau. Ses doigts brillent comme des étoiles. Pi, lui, n’est pas rassuré : il se cache sous le chapeau du capitaine. Les pirates rient. Cette nuit-là, personne ne veut aller se coucher.', q: [
        ['g', 'Quel titre convient le mieux à ce texte ?', 'La mer qui brille', ['La grande tempête', 'Le singe voleur'], 'Le texte raconte une nuit où la mer s’allume de petites lumières.'],

      { t: 'Le nœud de huit', x: 'Le nœud de huit est le premier nœud que tout mousse doit savoir faire. Il empêche une corde de glisser. Voici comment le faire.\nD’abord, prends le bout de la corde et fais une boucle. Ensuite, passe le bout derrière la corde. Puis, fais-le entrer dans la boucle par le haut. Enfin, tire doucement sur les deux côtés.\nTon nœud doit ressembler au chiffre 8. Entraîne-toi plusieurs fois : un bon marin fait ce nœud les yeux fermés !', q: [
        ['g', 'Ce texte sert à :', 'expliquer comment faire quelque chose', ['raconter une histoire', 'décrire un animal'], 'Il donne des étapes dans l’ordre : d’abord, ensuite, puis, enfin.'],
        ['e', 'À quoi sert le nœud de huit ?', 'à empêcher une corde de glisser', ['à attacher un perroquet', 'à décorer le bateau'], 'Le texte dit : « Il empêche une corde de glisser. »'],
        ['e', 'Que faut-il faire en dernier ?', 'tirer doucement sur les deux côtés', ['faire une boucle', 'passer le bout derrière la corde'], 'Le mot « Enfin » annonce la dernière étape.'],
        ['i', 'Pourquoi l’appelle-t-on « nœud de huit » ?', 'Il a la forme du chiffre 8.', ['Il faut huit cordes.', 'Il faut huit minutes.'], 'Le texte dit : « Ton nœud doit ressembler au chiffre 8. »'],
        ['v', 'Dans ce texte, un « mousse » est :', 'un jeune apprenti marin', ['une plante des rochers', 'une boisson'], 'Le mot « mousse » a plusieurs sens. Ici, on parle d’un marin qui apprend.']] },
      { t: 'Le message de la tortue', x: 'Un matin, une vieille tortue s’approche du bateau. Elle porte une algue nouée autour du cou. Tom l’aide à monter à bord et découvre un petit tube attaché à l’algue. Dedans, il y a un message : « Au secours ! Je suis coincé sur l’île aux Crabes. Signé : Jo. »\nLe capitaine fronce les sourcils. Jo est un vieux pêcheur, son ami de toujours. « Changement de cap ! » ordonne-t-il. Le Fier Calcul tourne vers le sud. La tortue, elle, retourne tranquillement dans l’eau, sa mission accomplie.', q: [
        ['g', 'Quel titre convient le mieux à ce texte ?', 'Un message pour sauver Jo', ['La recette de la soupe', 'Le singe voleur'], 'Toute l’histoire tourne autour du message de Jo, qui appelle au secours.'],

      { t: 'Le départ', x: 'Le Fier Calcul a quitté le port à l’aube. Ses voiles blanches se sont gonflées sous le vent du nord. Trois jours plus tard, la vigie a aperçu une île inconnue, couverte de palmiers.', q: [

      { t: 'La jambe de bois', x: 'Gros-Louis, le cuisinier, a une jambe de bois depuis qu’un requin l’a mordu. Il ne s’en plaint jamais : il dit que sa jambe ne craint ni les crampes ni les piqûres de moustiques.', q: [

      { t: 'Le baromètre', x: 'Le baromètre du bord descend depuis ce matin. Le capitaine sait ce que cela signifie : une tempête approche. Il ordonne d’attacher les tonneaux et de replier les voiles.', q: [

      { t: 'Le journal de bord', x: 'Lila tient le journal de bord. Chaque soir, elle y note la position du navire, la météo et les événements de la journée. Grâce à elle, on sait exactement où le bateau est passé.', q: [

      { t: 'Les dauphins', x: 'Les dauphins accompagnent souvent les navires. Ils nagent devant la proue et sautent hors de l’eau. Les marins disent qu’ils portent bonheur.', q: [

    p: [
      { t: 'Le passager clandestin', x: 'Depuis trois jours, des biscuits disparaissent de la réserve. Gros-Louis accuse Pi, mais le perroquet jure qu’il est innocent. Cette nuit, Tom se cache derrière un tonneau pour surveiller. Vers minuit, une petite silhouette se faufile entre les sacs de farine : c’est une fillette d’environ huit ans ! Elle s’est cachée à bord avant le départ, car elle rêvait de devenir pirate.', q: [

        ['e', 'Combien de fois par jour la mer monte-t-elle ?', 'deux fois', ['une fois', 'quatre fois'], 'Le texte dit : « Deux fois par jour, la mer monte puis redescend ».'],

      { t: 'Le défi', x: 'Le célèbre pirate Œil-de-Fer défie le capitaine Barbe-Grise : « Celui qui trouvera le trésor de l’île aux Brumes en premier sera le roi des mers ! » Barbe-Grise accepte, mais il n’a pas de carte. Tandis qu’Œil-de-Fer fonce vers l’île, Barbe-Grise prend le temps d’interroger les pêcheurs du port. Le lendemain, il apprend que le trésor n’est pas sur l’île, mais sous l’eau, juste à côté.', q: [
        ['e', 'Que doit trouver chaque pirate ?', 'le trésor de l’île aux Brumes', ['une carte', 'un perroquet'], 'Le défi : « Celui qui trouvera le trésor de l’île aux Brumes en premier… »'],
        ['i', 'Pourquoi Barbe-Grise interroge-t-il les pêcheurs ?', 'Il n’a pas de carte et cherche des indices.', ['Il veut acheter du poisson.', 'Il a peur d’Œil-de-Fer.'], 'Sans carte, il cherche des informations auprès de ceux qui connaissent la mer.'],

function ensureTide() {
  if (P().tide && P().tide.date === today()) return P().tide;
  const acc = i => { const s = IS(i.id); return P().rev.some(x => x.g === i.id && x.due <= today()) ? -2 : s.tot ? s.ok / s.tot : -1; };
  const weak = l => l.slice().sort((a, b) => acc(a) - acc(b) || IS(a.id).node - IS(b.id).node);
  const om = ISLES.filter(i => i.sea === 'm' && unlocked(i)), of = ISLES.filter(i => i.sea === 'f' && unlocked(i));
  const stops = []; for (const i of weak(om)) { if (stops.length < (of.length ? 1 : 2)) stops.push(i.id); }
  if (of.length) stops.push(weak(of)[0].id);
  const best = om.slice().sort((a, b) => acc(b) - acc(a)).find(i => !stops.includes(i.id));
  stops.push(best ? best.id : stops[0] || 'canons');
  while (stops.length < 3) stops.push('canons');
  P().tide = { date: today(), stops, i: 0, gold: 0, start: 0, done: false }; save();
  return P().tide;
}

    case 'next': if (R) { $$('.sheet-err').forEach(x => x.remove()); R.k++; nextQ(); } break;
    case 'power': { const p = el.dataset.p; if (!R || R.locked || R.used[p]) break; R.used[p] = true; SND.tap();
      if (p === 'perroquet') { const sc = $('#scene'); const h = document.createElement('div'); h.className = 'pi-tip paper'; h.setAttribute('role', 'note'); h.innerHTML = `<img src="${IMG('crew-perroquet')}" alt=""><div><b>Pi :</b> ${R.q.hint}</div><button class="x" data-a="tipclose" aria-label="Fermer l’indice">${ico('iClose')}</button>`; sc && sc.appendChild(h); el.disabled = true; voice('indice'); }
      if (p === 'crabe') { R.seen.add(R.q.log); nextQ(); toast('Le Crabe Compteur te donne une autre question.'); }
      if (p === 'calmar') { el.disabled = true; toast('Le Calmar Calcul doublera ton butin à la fin de l’escale !'); }
      break; }
    case 'openchest': openChest(); break;
    case 'port': renderPort(); break;
    case 'ep': S.epithet = el.dataset.e; save(); SND.tap(); renderPrime(); break;
    case 'eptip': toast(`Pour le gagner : ${el.dataset.h}.`); break;
    case 'rename': S.name = ''; onboarding(); break;
    case 'fb': openFeedback(); break;
    case 'fbclose': { const f = $('.fbwrap'); f && f.remove(); break; }
    case 'fbset': FB[el.dataset.k] = el.dataset.v; $$(`[data-a="fbset"][data-k="${el.dataset.k}"]`).forEach(b => b.setAttribute('aria-pressed', b === el)); break;
    case 'fbsend': sendFeedback(); break;
    case 'guide': window.open('aide.html', '_blank', 'noopener'); break;
    case 'bkcopy': { const c = backupCode(); copyText(c).then(ok => { toast(ok ? 'Code de sauvegarde copié' : 'Copiez le code ci-dessous'); $('#bkbox').innerHTML = `<p class="note" style="margin:12px 0 6px">Votre code (gardez-le précieusement) :</p><textarea class="fld" readonly style="min-height:90px;font-size:12px">${c}</textarea>`; }); break; }
    case 'bkrestore': $('#bkbox').innerHTML = `<p class="note" style="margin:12px 0 6px">Collez le code de sauvegarde. La progression actuelle sera remplacée.</p><textarea class="fld" id="bkin" style="min-height:90px;font-size:12px" placeholder="ARCHIPEL1:…"></textarea><div style="margin-top:8px"><button class="ghost-btn" data-a="bkdo">Restaurer</button></div>`; break;
    case 'bkdo': if (restoreFrom($('#bkin').value)) { toast('Progression restaurée'); setTimeout(() => location.reload(), 900); } else toast('Ce code ne fonctionne pas. Vérifiez qu’il est complet.'); break;
    case 'closeparents': { const p = $('.parents'); p && p.remove(); show(tab); break; }
    case 'grade': if (el.dataset.v !== GR()) { setGrade(el.dataset.v); toast(`Programme de ${GRADES[GR()].n} : chaque classe garde sa progression.`); } $('.parents').remove(); openParents(); break;
    case 'limit': S.limit = +el.dataset.v; save(); $('.parents').remove(); openParents(); break;
    case 'extend': extraMs += 5 * 60000; $('.parents').remove(); openParents(); toast('5 minutes de plus accordées.'); break;
    case 'snd': S.sound = el.dataset.v === '1'; save(); S.sound ? music(musWant || 'carte') : stopMusic(); $('.parents').remove(); openParents(); break;
    case 'mus': S.music = el.dataset.v === '1'; save(); S.music ? music(musWant || 'carte') : stopMusic(); $('.parents').remove(); openParents(); break;
    case 'vox': S.voice = el.dataset.v === '1'; save(); $('.parents').remove(); openParents(); break;
    case 'reset1': $('#resetbox').innerHTML = `<div class="seg"><button data-a="reset2" style="background:#5a2420;color:#ffb9ad">Oui, tout effacer</button><button data-a="reset0">Annuler</button></div>`; break;
    case 'reset0': $('.parents').remove(); openParents(); break;
    case 'reset2': S = DEF(); applyGrade(); save(); sessionMs = 0; mapScroll = null; $('.parents').remove(); show('map'); onboarding(); break;
  }
});
app.addEventListener('pointerup', e => {
  const svg = e.target.closest && e.target.closest('#line'); if (!svg || !R || R.locked || R.q.kind !== 'line') return;
  const r = svg.getBoundingClientRect(), vx = (e.clientX - r.left) / r.width * 340; R.pick = Math.max(0, Math.min(10, Math.round((vx - 30) / 28))); SND.tap(); refreshBottom();
});
document.addEventListener('keydown', e => {
  if ($('.title') && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); $('.title').click(); return; }
  if (!R || R.done) { if (e.key === 'Enter' && $('#chest.shake')) openChest(); return; }
  if ($('.coach')) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); $('[data-a="coachnext"]').click(); } return; }
  const qm = $('.quitm'); if (qm) { if (e.key === 'Escape') qm.remove(); return; }
  const sh = $('.sheet-err'); if (sh) { if (e.key === 'Enter') { e.preventDefault(); $('[data-a="next"]', sh).click(); } return; }
  const k = R.q.kind;
  if (k === 'keypad' || k === 'mineRead') { if (/^[0-9]$/.test(e.key)) key(e.key); else if (e.key === 'Backspace') key('del'); else if (e.key === 'Enter') { e.preventDefault(); key('ok'); } }
  else if (R.q.choices && /^[1-3]$/.test(e.key) && R.q.choices.length >= +e.key) { const b = $$('[data-a="choice"]')[+e.key - 1]; b && b.click(); }
  else if (e.key === 'Enter') { const v = $('[data-a="validate"]'); if (v && !v.disabled) { e.preventDefault(); v.click(); } }
});
window.addEventListener('pagehide', save);
window.addEventListener('resize', () => { if (!R && tab === 'map' && !$('.parents') && !$('.modal')) renderMap(); });
